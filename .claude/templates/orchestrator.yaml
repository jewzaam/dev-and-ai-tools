# Agentic Orchestrator Configuration
# Generated by agentic-scaffold. Edit per-project as needed.

# Workflow mode: test_first runs TEST before DEV (TDD)
workflow:
  test_first: true

# Retry limits per stage before BLOCKED
retry:
  max_attempts_per_stage: 3

# Quality gates
quality:
  # Lines per file limit (judge enforces)
  lines_limit: 300
  # Complexity via xenon (requires: pip install xenon)
  # Set to false to skip; judge falls back to lines-of-code checks
  complexity_check: true
  complexity_command: "python -m xenon {package} --max-absolute B --max-modules B --max-average A"

# Judge behavior
judge:
  # mandated_fixes block advancement until addressed
  mandated_fixes_blocking: true

# Model routing per stage
models:
  dev: sonnet
  test: sonnet
  review: sonnet
  judge: opus

# Path to personal coding standards (fallback after repo-local conventions)
# Leave empty to disable. Example: ~/source/standards/
standards_fallback: ""

# Execution tracing: capture inputs/outputs of each persona per turn
# Stored in ~/.claude/projects/{repo-name}/traces/
tracing:
  enabled: false
